<!doctype html><meta charset="utf-8"><title>Beachvibes patterns</title>
<style>body{margin:0;padding:32px;background:#F3EEE4;font:15px/1.4 system-ui;color:#242328}h1{font-weight:800;margin:0 0 24px}
main{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}figure{margin:0}.sw{height:170px;border-radius:6px;background-color:#F8F4EC;background-size:auto 56px;border:1px solid #e0d8c8}
.sw.dark{background-color:#242328;margin-top:8px;border-color:#242328}figcaption{margin-top:8px;font-size:13px}</style>
<h1>Beachvibes patterns</h1><main><figure><div class="sw" style="background-image:url(svg/triangle-band-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/triangle-band-white.svg)"></div><figcaption><b>triangle-band</b><br>Rules with a row of solid and open triangles (from the h and a)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/x-lattice-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/x-lattice-white.svg)"></div><figcaption><b>x-lattice</b><br>Crossing diagonals with a dot in every diamond (from the first e)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/spirals-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/spirals-white.svg)"></div><figcaption><b>spirals</b><br>Offset rows of spirals (from the b)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/chevron-heart-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/chevron-heart-white.svg)"></div><figcaption><b>chevron-heart</b><br>Nested chevrons with a heart (from the v)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/diagonal-stripes-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/diagonal-stripes-white.svg)"></div><figcaption><b>diagonal-stripes</b><br>Even diagonal hatching (from the second e)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/ladder-band-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/ladder-band-white.svg)"></div><figcaption><b>ladder-band</b><br>Framed band of short bars (from the s)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/dot-rule-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/dot-rule-white.svg)"></div><figcaption><b>dot-rule</b><br>Double rule with dots and squares (from the a)</figcaption></figure><figure><div class="sw" style="background-image:url(svg/tribal-border-ink.svg)"></div><div class="sw dark" style="background-image:url(svg/tribal-border-white.svg)"></div><figcaption><b>tribal-border</b><br>All bands stacked into one border strip</figcaption></figure></main>
